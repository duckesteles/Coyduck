name: pack

on:
  push:
    branches: [texture]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: CoyTextures
          path: dist/*.zip
