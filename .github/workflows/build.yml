name: Build
on:
  push:
    branches: ['logger']
    tags: ['logger-v*']
  pull_request:
    branches: ['logger']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: coyduck-logger
          path: build/libs/*.jar

      - if: startsWith(github.ref, 'refs/tags/logger-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Coyduck Logger ${{ github.ref_name }}
          body: Minecraft 1.21.11, Fabric. Records your own fights for analysis and never writes coordinates.
          files: build/libs/*.jar
